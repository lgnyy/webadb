<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya-WebADB - 浏览器端 ADB 工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-layout">

<!-- ===== Sidebar (left navigation + connection controls) ===== -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">📱</div>
        <div class="logo-text">
            <h1>Ya-WebADB</h1>
            <span>浏览器端 Android 调试工具</span>
        </div>
    </div>

    <div class="sidebar-connect">
        <button id="connectBtn" class="btn btn-primary btn-sm btn-block">🔌 USB 连接</button>
        <div class="wifi-connect">
            <input type="text" id="wsUrlInput" class="ws-url-input" value="ws://localhost:15037/bridge" placeholder="tango-bridge 地址">
            <input type="text" id="wifiAddrInput" class="ws-url-input" placeholder="设备 IP:端口（无线调试主页）">
            <button id="connectWifiBtn" class="btn btn-primary btn-sm btn-block">📶 WiFi 连接</button>
            <input type="text" id="pairAddrInput" class="ws-url-input" placeholder="配对 IP:端口（配对码页面）">
            <div class="wifi-pair-row">
                <input type="text" id="pairCodeInput" class="ws-url-input" placeholder="6 位配对码" maxlength="7" inputmode="numeric">
                <button id="pairWifiBtn" class="btn btn-secondary btn-sm">🔑 配对</button>
            </div>
        </div>
        <button id="disconnectBtn" class="btn btn-secondary btn-sm btn-block" disabled>⏏ 断开</button>
        <div class="device-info" id="deviceStatus">
            <span class="dot"></span>
            <span class="status-text" id="deviceStatusText">未连接</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="shell">
            <span class="nav-icon">💻</span><span class="nav-label">Shell 命令</span>
        </button>
        <button class="nav-item" data-tab="tty">
            <span class="nav-icon">🖥️</span><span class="nav-label">Shell 终端</span>
        </button>
        <button class="nav-item" data-tab="portforward">
            <span class="nav-icon">🔌</span><span class="nav-label">端口转发</span>
        </button>
        <button class="nav-item" data-tab="filemgr">
            <span class="nav-icon">📁</span><span class="nav-label">文件管理</span>
        </button>
        <button class="nav-item" data-tab="screenshot">
            <span class="nav-icon">📸</span><span class="nav-label">截图/录屏</span>
        </button>
        <button class="nav-item" data-tab="scrcpy">
            <span class="nav-icon">📺</span><span class="nav-label">投屏控制</span>
        </button>
    </nav>
</aside>

<!-- ===== Main Content (right side) ===== -->
<main class="main">
    <!-- Shell Tab (iframe, shares parent ADB connection) -->
    <section class="tab-pane active" id="tab-shell">
        <iframe class="tool-frame" data-src="shell.html" title="Shell 命令"></iframe>
    </section>

    <!-- Terminal Tab (iframe, shares parent ADB connection) -->
    <section class="tab-pane" id="tab-tty">
        <iframe class="tool-frame" data-src="tty.html" title="Shell 终端"></iframe>
    </section>

    <!-- Port Forward Tab (iframe, shares parent ADB connection) -->
    <section class="tab-pane" id="tab-portforward">
        <iframe class="tool-frame" data-src="portforward.html" title="端口转发"></iframe>
    </section>

    <!-- File Manager Tab (iframe, shares parent ADB connection) -->
    <section class="tab-pane" id="tab-filemgr">
        <iframe class="tool-frame" data-src="filemgr.html" title="文件管理"></iframe>
    </section>

    <!-- Screenshot & Recording Tab -->
    <section class="tab-pane" id="tab-screenshot">
        <iframe class="tool-frame" data-src="screenshot.html?v=3" title="截图/录屏"></iframe>
    </section>

    <!-- Scrcpy Screen Mirroring Tab -->
    <section class="tab-pane" id="tab-scrcpy">
        <iframe class="tool-frame" data-src="scrcpy.html?v=18" title="投屏控制"></iframe>
    </section>
</main>

<!-- ===== Import Map ===== -->
<script type="importmap">
{
    "imports": {
        "@yume-chan/adb": "https://esm.sh/@yume-chan/adb?external=@yume-chan/stream-extra",
        "@yume-chan/adb-credential-web": "https://esm.sh/@yume-chan/adb-credential-web",
        "@yume-chan/adb-daemon-webusb": "https://esm.sh/@yume-chan/adb-daemon-webusb?external=@yume-chan/stream-extra",
        "@yume-chan/stream-extra": "https://esm.sh/@yume-chan/stream-extra?bundle=false",
        "@yume-chan/scrcpy": "https://esm.sh/@yume-chan/scrcpy@2.3.0?bundle",
        "@yume-chan/adb-scrcpy": "https://esm.sh/@yume-chan/adb-scrcpy@2.3.2?bundle"
    }
}
</script>

<!-- ===== Scripts ===== -->
<script type="module" src="js/parent-bridge.js?v=1064"></script>

<!-- ===== Tab Switching (lazy-load iframes on demand) ===== -->
<script>
// 动态加载 iframe：仅在首次切换到某个 tab 时才设置其 src，避免一次性加载全部页面
function loadTabIframe(tab) {
    const pane = document.getElementById('tab-' + tab);
    if (!pane) return;
    const frame = pane.querySelector('iframe.tool-frame');
    // 仅当 iframe 尚未设置 src 时才加载（已加载过的保持缓存，切回无需重载）
    if (frame && !frame.src) {
        frame.src = frame.dataset.src;
    }
}

// 页面加载完成后，立即加载当前激活（默认）tab 的 iframe
const firstActiveTab = document.querySelector('.nav-item.active');
if (firstActiveTab) loadTabIframe(firstActiveTab.dataset.tab);

document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
        // 切换到该 tab 时按需加载 iframe
        loadTabIframe(tab);
    });
});
</script>

</body>
</html>
